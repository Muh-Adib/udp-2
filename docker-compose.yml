# =============================================================
# Multi-Brand CRM — deployment Coolify / docker compose (SQLite)
# -------------------------------------------------------------
# Mengikuti pola "Generated Stack Values" Coolify:
# https://coolify.io/docs/applications/builds/docker-compose#generated-stack-values
#
# - TANPA binding port host (ports:) — port host 3000 sering sudah
#   dipakai layanan lain di server → "port is already allocated".
#   Aplikasi diakses lewat domain Coolify (proxy internal Docker).
# - SERVICE_FQDN_APP_3000 → Coolify otomatis generate domain & mendaftarkan
#   route proxy ke port 3000 di dalam container. Domain bisa diganti di UI
#   Coolify (Environment Variables / Domains).
# - Data tersimpan persisten di volume "db-data".
# =============================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      # === Coolify generated stack values ===
      # Domain otomatis dari Coolify → diproxy ke port 3000 container.
      # Value variabel ini di dalam container = URL yang di-generate.
      - SERVICE_FQDN_APP_3000
      # === Aplikasi ===
      # Path database DI DALAM container (volume di bawah).
      - DATABASE_URL=file:/app/data/custom.db
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Opsional — kunci layanan AI (ringkasan opportunity). Kosongkan bila tak dipakai.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - Z_AI_API_KEY=${Z_AI_API_KEY:-}
      # Kunci tanda-tangan cookie sesi (fail-closed sejak Ronde 36).
      # Bila kosong, docker-entrypoint.sh otomatis generate & simpan di volume.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Opsional — variabel SMTP global (kredensial email kanal dikelola via UI Saluran & Integrasi).
    volumes:
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(200<=r.status&&r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
