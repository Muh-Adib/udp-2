# =============================================================
# Multi-Brand CRM — deployment sederhana 1 container (SQLite)
#   docker compose up -d --build   →  http://localhost:3000
# Data tersimpan persisten di volume "db-data".
# =============================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grup-crm
    ports:
      - "3000:3000"
    environment:
      # Path database DI DALAM container (volume di bawah).
      - DATABASE_URL=file:/app/data/custom.db
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Opsional — kunci layanan AI (ringkasan opportunity). Kosongkan bila tak dipakai.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - Z_AI_API_KEY=${Z_AI_API_KEY:-}
      # Opsional — variabel SMTP global (kredensial email kanal dikelola via UI Saluran & Integrasi).
    volumes:
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(200<=r.status&&r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
