# =============================================================
# Multi-Brand CRM — deployment Coolify / docker compose (SQLite)
# -------------------------------------------------------------
# ARSITEKTUR (redesign Ronde 63 — runtime bersih tanpa entrypoint):
#   service `migrate` (one-shot, exit setelah selesai):
#     - generate SESSION_SECRET → file persisten di volume (sekali, first deploy)
#     - salin DB seed demo bila volume kosong (first boot)
#     - sinkronisasi schema Prisma (db push, idempoten)
#   service `app` (runtime murni `CMD bun server.js` — TANPA entrypoint/shell):
#     - start SETELAH migrate sukses (depends_on service_completed_successfully)
#     - secret dibaca via `bun --env-file=/app/data/.session-secret` (CMD Dockerfile)
#
# Prioritas SESSION_SECRET: env platform (Coolify) > file .session-secret di volume
# (digenerate service migrate saat first deploy) > generate otomatis saat migrate.
# Semua variabel aplikasi bersifat OPSIONAL dgn pola ${VAR:-} — kosong di Coolify
# = fitur off / default aman; user bebas mengisinya di tab Environment Variables.
#
# Mengikuti pola "Generated Stack Values" Coolify:
# https://coolify.io/docs/applications/builds/docker-compose#generated-stack-values
#   - TANPA binding port host (ports:) — akses via domain Coolify (proxy internal).
#   - SERVICE_FQDN_APP_3000 → Coolify generate domain + route proxy ke port 3000.
#   - Data persisten di volume "db-data" (database + secret file).
# =============================================================
services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    # One-shot — BUKAN server. Gagal di sini = deploy gagal jelas (app tak nyala
    # dengan schema/secret invalid); error migrasi tampil di log deploy.
    command: ["sh", "/app/docker-migrate.sh"]
    environment:
      - DATABASE_URL=file:/app/data/custom.db
      # Env platform dipakai bila diset; bila kosong → script generate file secret
      # persisten di volume (prioritas: env Coolify > file .session-secret > generate).
      - SESSION_SECRET=${SESSION_SECRET:-}
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - db-data:/app/data
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      # === Coolify generated stack values ===
      # Domain otomatis dari Coolify → diproxy ke port 3000 container.
      - SERVICE_FQDN_APP_3000
      # === Aplikasi ===
      - DATABASE_URL=file:/app/data/custom.db
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Kunci tanda-tangan cookie sesi (fail-closed sejak Ronde 36).
      # Prioritas: env platform (Coolify) > file /app/data/.session-secret di volume
      # — file dimuat `bun --env-file=...` di CMD Dockerfile SEBELUM modul apa pun
      # dievaluasi; env Coolify TIDAK tertimpa file; bila keduanya kosong, service
      # `migrate` mengenerate file secret persisten di volume saat first deploy.
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Opsional — webhook WhatsApp (Meta): token handshake GET verify & secret
      # validasi tanda-tangan X-Hub-Signature-256. Kosong = fallback kredensial
      # kanal di DB (UI Saluran & Integrasi); produksi tanpa keduanya menolak webhook.
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      # Opsional — Web Push (VAPID): kosong = fitur push browser nonaktif.
      # Pasangan kunci dibuat via `bunx web-push generate-vapid-keys`.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      # Opsional — set "1" utk mengizinkan reseed paksa via POST /api/bootstrap
      # di produksi (di luar itu reseed paksa hanya di development). Kosong = off.
      - ALLOW_RESEED=${ALLOW_RESEED:-}
      # Aplikasi TIDAK memakai API pihak ketiga berbayar (ringkasan opportunity
      # memakai heuristik lokal tanpa jaringan; kredensial kanal dikelola via UI).
    volumes:
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(200<=r.status&&r.status<400?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db-data:
